version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# docker/podman-compose.yml
#
# Single compose file for all environments using profiles.
#
# Usage:
#   Dev  (infra only, app runs via Poetry):
#     podman-compose --profile dev up -d
#
#   QA   (fully containerised):
#     podman-compose --profile qa up -d --build
#
#   Prod (fully containerised, no Swagger):
#     podman-compose --profile prod up -d --build
#
#   Stop all:
#     podman-compose --profile dev down        (or qa / prod)
#
#   Logs:
#     podman-compose --profile qa logs -f api-qa
# ─────────────────────────────────────────────────────────────────────────────

networks:
  rag-net:
    driver: bridge

volumes:
  qdrant_storage:
  redis_storage:

services:

  # ── Qdrant ──────────────────────────────────────────────────────────────────
  # Shared across ALL profiles — always starts regardless of environment.
  qdrant:
    image: docker.io/qdrant/qdrant:latest
    container_name: insurance-qdrant
    restart: always
    profiles: ["dev", "qa", "prod"]
    ports:
      - "6333:6333"     # REST API
      - "6334:6334"     # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
    networks:
      - rag-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Redis Stack ──────────────────────────────────────────────────────────────
  # Shared across ALL profiles.
  redis:
    image: docker.io/redis/redis-stack:latest
    container_name: insurance-redis
    restart: always
    profiles: ["dev", "qa", "prod"]
    ports:
      - "6379:6379"     # Redis
      - "8001:8001"     # RedisInsight UI
    volumes:
      - redis_storage:/data
    environment:
      REDIS_ARGS: "--save 60 1 --loglevel warning"
    networks:
      - rag-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ── API — QA profile ─────────────────────────────────────────────────────────
  # Full containerised stack. Swagger UI ON. For QA testers.
  api-qa:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: insurance-api-qa
    restart: always
    profiles: ["qa"]
    ports:
      - "8080:8080"
    env_file:
      - ../.env.qa
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      ENV: qa
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: INFO
      LOG_RAW_QUERIES: "false"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag-net
    volumes:
      - ../src/app/rag/docs:/app/src/app/rag/docs:ro

  # ── API — Prod profile ───────────────────────────────────────────────────────
  # Full containerised stack. Swagger UI OFF. WARNING logs only.
  api-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: insurance-api-prod
    restart: always
    profiles: ["prod"]
    ports:
      - "8080:8080"
    env_file:
      - ../.env.prod
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      ENV: production
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: WARNING
      LOG_RAW_QUERIES: "false"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rag-net
    volumes:
      - ../src/app/rag/docs:/app/src/app/rag/docs:ro

  # ── NOTE: No api service in dev profile ─────────────────────────────────────
  # In dev, run the FastAPI app directly with Poetry for hot-reload:
  #   poetry run python src/app/main.py
  # The app connects to qdrant and redis containers via localhost ports.