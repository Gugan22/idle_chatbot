[project]
name = "chatbot"
version = "0.1.0"
description = "Customizable RAG Chatbot"
authors = [
    {name = "Gugan", email = "gugan2206@gmail.com"}
]
readme = "README.md"
requires-python = "<3.15,>=3.10"

dependencies = [
    # ── API ───────────────────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # ── Auth ──────────────────────────────────────────────────────────────
    "PyJWT>=2.8.0",

    # ── Config & validation ───────────────────────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",

    # ── Vector DB ─────────────────────────────────────────────────────────
    "qdrant-client>=1.9.0",

    # ── Semantic cache ────────────────────────────────────────────────────
    "redis[hiredis]>=5.0.0",
    "numpy>=1.26.0",

    # ── Embedding + reranking ─────────────────────────────────────────────
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",

    # ── LLM inference (OpenAI-compatible — works with NVIDIA NIM + Ollama)
    "openai>=1.30.0",

    # ── Guardrails ────────────────────────────────────────────────────────

    # ── Document parsing ──────────────────────────────────────────────────
    "python-frontmatter>=1.1.0",

    # ── Observability ─────────────────────────────────────────────────────

    # ── Resilience ────────────────────────────────────────────────────────
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
evaluation = [
    "ragas>=0.1.9",
]
observability = [
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
]
advanced-guardrails = [
    "nemoguardrails>=0.9.0",
]

[project.scripts]
idle-chatbot = "app.main:start_server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = [
    "frontend/*.html",
    "frontend/*.css",
    "frontend/*.js",
    "rag/docs/*.md",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
